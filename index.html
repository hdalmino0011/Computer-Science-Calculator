<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>CS Calculator | Hanz Dalmino</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app-container">
    <div class="top-bar">
        <button class="menu-btn" id="menuToggleBtn">☰</button>
        <div class="title">CS CALCULATOR</div>
        <div style="width: 40px;"></div>
    </div>
    
    <div class="display-area">
        <div class="expression-input">
            <input type="text" id="exprInput" placeholder="Enter expression ..." autocomplete="off">
        </div>
        <div class="result-box">
            <span class="result-label">=</span>
            <span id="resultDisplay">0</span>
        </div>
        <div class="steps-box">
            <div class="steps-label">STEPS</div>
            <div id="stepsDisplay">Ready</div>
        </div>
    </div>

    <div class="buttons-panel">
        <div class="branch-holder">
            <button class="branch-btn active" data-branch="arithmetic">ARITH</button>
            <button class="branch-btn" data-branch="combinatorics">COMBO</button>
            <button class="branch-btn" data-branch="logic">LOGIC</button>
            <button class="branch-btn" data-branch="settheory">SET</button>
            <button class="branch-btn" data-branch="numbertheory">NUMTH</button>
            <button class="branch-btn" data-branch="conversion">CONV</button>
            <button class="branch-btn" data-branch="matrix">MATRIX</button>
            <button class="branch-btn" data-branch="complex">COMPLEX</button>
        </div>
        <div id="dynamicButtons" class="button-grid"></div>
        <div class="action-buttons">
            <button id="equalBtn" class="action-btn eval-btn">=</button>
            <button id="clearBtn" class="action-btn">C</button>
            <button id="backBtn" class="action-btn">⌫</button>
            <button id="historyShowBtn" class="action-btn">HIST</button>
        </div>
    </div>
</div>

<!-- Side Drawer -->
<div id="drawer" class="drawer">
    <button class="close-drawer" id="closeDrawerBtn">✖ CLOSE</button>
    
    <div class="drawer-section">
        <div class="drawer-section-title">THEMES</div>
        <div id="themesGallery" class="themes-gallery"></div>
    </div>
    
    <div class="drawer-section">
        <div class="drawer-section-title">FONT</div>
        <select id="fontSelector" class="font-select">
            <option value="Times New Roman">Times New Roman</option>
            <option value="Arial">Arial</option>
            <option value="Courier New">Courier New</option>
            <option value="Georgia">Georgia</option>
            <option value="Verdana">Verdana</option>
        </select>
    </div>
    
    <div class="drawer-section">
        <div class="drawer-section-title">ABOUT</div>
        <div class="about-content">
            <strong>Hanz Dalmino</strong><br>
            Cebu Technological University<br><br>
            CS/IT Mathematics Tool<br>
            Step-by-step evaluation for all topics.
        </div>
    </div>
    
    <div class="drawer-section">
        <button id="drawerClearCacheBtn" class="drawer-action-btn">CLEAR CACHE</button>
        <button id="drawerExitBtn" class="drawer-action-btn">RESET</button>
    </div>
</div>
<div id="overlay" class="overlay"></div>

<!-- History Modal -->
<div id="historyModal" class="history-modal">
    <div class="history-header">
        <h3>HISTORY</h3>
        <button id="closeHistoryBtn" class="close-modal-btn">X</button>
    </div>
    <div id="historyList" class="history-list">No history</div>
    <button id="clearHistoryBtn" class="clear-history-btn">CLEAR ALL</button>
</div>

<script src="script.js"></script>
</body>
</html>
