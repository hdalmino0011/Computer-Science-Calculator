<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>Universal CS Calculator | Hanz Dalmino</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app-container">
    <div class="top-bar">
        <button class="menu-btn" id="menuToggleBtn">☰</button>
        <div class="title">UNIVERSAL CS CALCULATOR</div>
        <div style="width: 40px;"></div>
    </div>

    <!-- Main Calculator View -->
    <div id="calculatorView" class="calculator-view">
        <div class="display-area">
            <div class="expression-input">
                <input type="text" id="exprInput" placeholder="Enter expression ..." autocomplete="off">
            </div>
            <div class="result-box">
                <span class="result-label">=</span>
                <span id="resultDisplay">0</span>
            </div>
            <div id="fallbackMessage" class="fallback-message" style="display: none;"></div>
        </div>

        <div class="buttons-panel">
            <div id="dynamicButtons" class="button-grid"></div>
            <div class="action-buttons">
                <button id="equalBtn" class="action-btn eval-btn">=</button>
                <button id="clearBtn" class="action-btn">C</button>
                <button id="backBtn" class="action-btn">⌫</button>
            </div>
        </div>
    </div>

    <!-- Full Page Content Views (hidden initially) -->
    <div id="fullPageView" class="full-page-view" style="display: none;">
        <div class="full-page-header">
            <button id="closeFullPageBtn" class="back-btn">← BACK</button>
            <div id="fullPageTitle" class="full-page-title"></div>
            <div style="width: 60px;"></div>
        </div>
        <div id="fullPageContent" class="full-page-content"></div>
    </div>

    <!-- Step-by-Step Full View (hidden initially) -->
    <div id="stepsView" class="steps-view" style="display: none;">
        <div class="steps-header">
            <button id="backToCalculatorBtn" class="back-btn">← BACK</button>
            <div class="steps-title">STEP BY STEP EVALUATION</div>
            <div style="width: 60px;"></div>
        </div>
        <div class="steps-expression" id="stepsExpression"></div>
        <div class="steps-result-full" id="stepsResultFull"></div>
        <div class="steps-list-full" id="stepsListFull"></div>
    </div>
</div>

<!-- Side Drawer (Menu) -->
<div id="drawer" class="drawer">
    <button class="close-drawer" id="closeDrawerBtn">✖ CLOSE</button>

    <div class="drawer-section">
        <div class="drawer-section-title">CALCULATOR MODES</div>
        <div id="branchSelector" class="branch-selector">
            <button class="branch-drawer-btn" data-branch="universal">Universal (Scientific)</button>
            <button class="branch-drawer-btn" data-branch="arithmetic">Arithmetic & Bitwise</button>
            <button class="branch-drawer-btn" data-branch="combinatorics">Combinatorics</button>
            <button class="branch-drawer-btn" data-branch="logic">Logic & Boolean</button>
            <button class="branch-drawer-btn" data-branch="settheory">Set Theory</button>
            <button class="branch-drawer-btn" data-branch="numbertheory">Number Theory</button>
            <button class="branch-drawer-btn" data-branch="conversion">Number System Conversion</button>
            <button class="branch-drawer-btn" data-branch="matrix">Matrix Algebra</button>
            <button class="branch-drawer-btn" data-branch="complex">Complex Numbers</button>
        </div>
    </div>

    <div class="drawer-section">
        <button id="drawerThemesBtn" class="drawer-action-btn">THEMES (12)</button>
        <button id="drawerFontBtn" class="drawer-action-btn">FONT</button>
        <button id="drawerHistoryBtn" class="drawer-action-btn">HISTORY</button>
        <button id="drawerAboutBtn" class="drawer-action-btn">ABOUT</button>
        <button id="drawerClearCacheBtn" class="drawer-action-btn">CLEAR CACHE</button>
        <button id="drawerExitBtn" class="drawer-action-btn">RESET SESSION</button>
    </div>
</div>
<div id="overlay" class="overlay"></div>

<script src="script.js"></script>
</body>
</html>
