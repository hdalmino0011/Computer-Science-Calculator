<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>Universal CS Calculator | Hanz Dalmino</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app-container">
    <div class="top-bar">
        <button class="menu-btn" id="menuToggleBtn">☰</button>
        <div class="title">UNIVERSAL CS CALCULATOR</div>
        <div style="width: 40px;"></div>
    </div>

    <!-- Main Calculator View -->
    <div id="calculatorView" class="calculator-view">
        <div class="display-area">
            <div class="expression-input">
                <input type="text" id="exprInput" placeholder="Enter expression ..." autocomplete="off">
            </div>
            <div class="result-box">
                <span class="result-label">=</span>
                <span id="resultDisplay">0</span>
            </div>
        </div>

        <div class="buttons-panel">
            <div class="branch-holder" id="branchSelector">
                <button class="branch-btn active" data-branch="universal">Universal</button>
                <button class="branch-btn" data-branch="arithmetic">Arithmetic</button>
                <button class="branch-btn" data-branch="combinatorics">Combinatorics</button>
                <button class="branch-btn" data-branch="logic">Logic</button>
                <button class="branch-btn" data-branch="settheory">Set Theory</button>
                <button class="branch-btn" data-branch="numbertheory">Number Theory</button>
                <button class="branch-btn" data-branch="conversion">Conversion</button>
                <button class="branch-btn" data-branch="matrix">Matrix</button>
                <button class="branch-btn" data-branch="complex">Complex</button>
            </div>
            <div id="dynamicButtons" class="button-grid"></div>
            <div class="action-buttons">
                <button id="equalBtn" class="action-btn eval-btn">= EVALUATE</button>
                <button id="clearBtn" class="action-btn">CLEAR</button>
                <button id="backBtn" class="action-btn">DELETE</button>
            </div>
        </div>
    </div>

    <!-- Step-by-Step Full View -->
    <div id="stepsView" class="steps-view" style="display: none;">
        <div class="steps-header">
            <button id="backToCalculatorBtn" class="back-btn">← BACK</button>
            <div class="steps-title">STEP BY STEP EVALUATION</div>
            <div style="width: 60px;"></div>
        </div>
        <div class="steps-expression" id="stepsExpression"></div>
        <div class="steps-result-full" id="stepsResultFull"></div>
        <div class="steps-list-full" id="stepsListFull"></div>
    </div>
</div>

<!-- Side Drawer -->
<div id="drawer" class="drawer">
    <button class="close-drawer" id="closeDrawerBtn">✖ CLOSE</button>

    <div class="drawer-section">
        <div class="drawer-section-title">THEMES</div>
        <div id="themesGallery" class="themes-gallery"></div>
    </div>

    <div class="drawer-section">
        <div class="drawer-section-title">FONT</div>
        <select id="fontSelector" class="font-select">
            <option value="Times New Roman">Times New Roman</option>
            <option value="Arial">Arial</option>
            <option value="Courier New">Courier New</option>
            <option value="Georgia">Georgia</option>
            <option value="Verdana">Verdana</option>
        </select>
    </div>

    <div class="drawer-section">
        <div class="drawer-section-title">HISTORY</div>
        <button id="drawerHistoryBtn" class="drawer-action-btn">VIEW HISTORY</button>
        <button id="drawerClearHistoryBtn" class="drawer-action-btn" style="background:#ef4444;">CLEAR HISTORY</button>
    </div>

    <div class="drawer-section">
        <div class="drawer-section-title">ABOUT</div>
        <div class="about-content">
            <strong>Hanz Dalmino</strong><br>
            Cebu Technological University<br><br>
            CS/IT Mathematics Tool – step-by-step evaluation.
        </div>
        <button id="drawerAboutBtn" class="drawer-action-btn" style="margin-top:8px;">FULL ABOUT</button>
    </div>

    <div class="drawer-section">
        <button id="drawerClearCacheBtn" class="drawer-action-btn">CLEAR CACHE</button>
        <button id="drawerExitBtn" class="drawer-action-btn">RESET SESSION</button>
    </div>
</div>
<div id="overlay" class="overlay"></div>

<!-- History Modal -->
<div id="historyModal" class="history-modal" style="display:none;">
    <div class="history-header">
        <h3>HISTORY</h3>
        <button id="closeHistoryBtn" class="close-modal-btn">X</button>
    </div>
    <div id="historyList" class="history-list">No history</div>
</div>

<script src="script.js"></script>
</body>
</html>
